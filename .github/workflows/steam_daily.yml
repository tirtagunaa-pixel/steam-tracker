name: Steam Daily Capture
# Runs daily at 08:00 WIB on GitHub's servers (public repo — reliable schedule)

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC = 08:00 WIB (UTC+7)
  workflow_dispatch:        # allow manual run from GitHub UI

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credentials
        env:
          GOOGLE_SA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          WATCH_CFG: ${{ secrets.WATCH_CONFIG }}
        run: |
          mkdir -p output
          python3 -c "import os; s=os.environ['GOOGLE_SA']; i=s.find('{'); open('scripts/service_account.json','w').write(s[i:] if i>=0 else s)"
          python3 -c "import os; s=os.environ['WATCH_CFG']; i=s.find('{'); open('scripts/watch_config.json','w').write(s[i:] if i>=0 else s)"

      - name: Daily wishlist capture
        run: python scripts/steam_wishlist_tracker.py --mode daily

      - name: Player count & studio watch update
        run: python scripts/update_steam_watch.py
