name: Steam Weekly Report
# Runs every Monday at 11:00 WIB on GitHub's servers — laptop does not need to be on

on:
  schedule:
    - cron: '0 4 * * 1'   # 04:00 UTC Monday = 11:00 WIB Monday
  workflow_dispatch:        # allow manual run from GitHub UI

jobs:
  weekly-report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credentials
        env:
          GOOGLE_SA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          WATCH_CFG: ${{ secrets.WATCH_CONFIG }}
        run: |
          mkdir -p output
          python3 -c "import os; s=os.environ['GOOGLE_SA']; i=s.find('{'); open('scripts/service_account.json','w').write(s[i:] if i>=0 else s)"
          python3 -c "import os; s=os.environ['WATCH_CFG']; i=s.find('{'); open('scripts/watch_config.json','w').write(s[i:] if i>=0 else s)"

      - name: Weekly AI summary + Seatalk report
        run: python scripts/steam_wishlist_tracker.py --mode weekly
